<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Библиотека</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-left">
      <span class="header-title" id="nav-title">Библиотека</span>
    </div>
    <div class="controls">
      <button class="btn btn-icon" id="btn-font-dec" aria-label="Уменьшить шрифт">A−</button>
      <button class="btn btn-icon" id="btn-font-inc" aria-label="Увеличить шрифт">A+</button>
      <button class="btn btn-icon" id="btn-theme" aria-label="Сменить тему">🌓</button>
    </div>
  </header>

  <main>
    <section id="library-view">
      <div class="search-wrap">
        <input type="text" class="search-input" id="search-box" placeholder="Поиск книги или автора...">
      </div>

      <div class="filter-bar" id="filters-container">
        <button class="filter-chip active" data-author="all">Все книги</button>
        <button class="filter-chip" data-author="Пушкин">Пушкин</button>
        <button class="filter-chip" data-author="Чехов">Чехов</button>
        <button class="filter-chip" data-author="Толстой">Толстой</button>
        <button class="filter-chip" data-author="Гоголь">Гоголь</button>
        <button class="filter-chip" data-author="Достоевский">Достоевский</button>
        <button class="filter-chip" data-author="Тургенев">Тургенев</button>
      </div>

      <div class="book-list" id="books-container"></div>
    </section>

    <section id="chapter-select-view">
      <button class="btn btn-nav" id="btn-back-to-library">← К списку книг</button>
      <h1 class="book-heading" id="select-title"></h1>
      <div class="book-author" id="select-author"></div>
      
      <h2 class="chapters-title">Выберите главу для чтения:</h2>
      <div class="chapters-list" id="chapters-container"></div>
    </section>

    <section id="reader-view">
      <div class="reader-top-nav">
        <button class="btn btn-nav" id="btn-back-to-chapters">← К главам</button>
        <button class="btn btn-nav" id="btn-back-to-books">К списку книг</button>
      </div>

      <div class="reader-header-info">
        <h1 class="reader-book-title" id="reader-book-title"></h1>
        <div class="reader-chapter-title" id="reader-chapter-title"></div>
      </div>

      <article class="book-content" id="reader-content"></article>

      <div class="chapter-navigation">
        <button class="btn btn-chapter-step" id="btn-prev-chapter">← Предыдущая глава</button>
        <button class="btn btn-chapter-step" id="btn-next-chapter">Следующая глава →</button>
      </div>

      <button class="btn btn-nav btn-full" id="btn-bottom-to-chapters">← Вернуться к оглавлению</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
