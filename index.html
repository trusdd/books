<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Библиотека классики</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <span class="header-title" id="nav-title">Библиотека</span>
    <div class="controls">
      <button class="btn" id="btn-font-dec">A−</button>
      <button class="btn" id="btn-font-inc">A+</button>
      <button class="btn" id="btn-theme">🌓</button>
    </div>
  </header>

  <main>
    <section id="library-view">
      <input type="text" class="search-input" id="search-box" placeholder="Поиск произведения или автора...">
      
      <div class="filter-bar" id="filters-container">
        <button class="filter-chip active" data-author="all">Все</button>
        <button class="filter-chip" data-author="Пушкин">Пушкин</button>
        <button class="filter-chip" data-author="Чехов">Чехов</button>
        <button class="filter-chip" data-author="Толстой">Толстой</button>
        <button class="filter-chip" data-author="Гоголь">Гоголь</button>
        <button class="filter-chip" data-author="Достоевский">Достоевский</button>
        <button class="filter-chip" data-author="Тургенев">Тургенев</button>
        <button class="filter-chip" data-author="Лермонтов">Лермонтов</button>
      </div>

      <div class="book-list" id="books-container"></div>
    </section>

    <section id="reader-view">
      <button class="btn btn-full" id="btn-back">← Вернуться к списку книг</button>
      <h1 id="reader-title"></h1>
      <div id="reader-author" class="reader-subtitle"></div>
      
      <div id="reader-status" class="status-msg"></div>
      <article class="book-content" id="reader-content"></article>

      <button class="btn btn-full" id="btn-back-bottom">← Вернуться к списку книг</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
