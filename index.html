<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#faf8f3">
  <meta name="color-scheme" content="light dark">
  <title>Приятного чтения!</title>
  <link rel="stylesheet" href="style.css">
  <script>
    (function() {
      var saved = localStorage.getItem("theme");
      if (saved === "dark") {
        document.documentElement.classList.add("theme-dark");
      }
    })();
  </script>
</head>
<body>

  <header class="app-header">
    <div class="header-inner">
      <span class="header-logo" id="header-title">Приятного чтения!</span>
      <div class="header-actions">
        <button type="button" class="btn btn-theme" id="btn-theme-toggle" aria-label="Переключить тему">Тёмная</button>
        <div class="reader-toolbar" id="reader-controls" hidden>
          <button type="button" class="btn btn-tool" id="btn-font-dec" aria-label="Уменьшить шрифт">А− Меньше</button>
          <button type="button" class="btn btn-tool" id="btn-font-inc" aria-label="Увеличить шрифт">А+ Больше</button>
        </div>
      </div>
    </div>
  </header>

  <main class="app-main">
    <section id="view-catalog" class="view-panel">
      <div class="search-section">
        <label for="search-input" class="field-label">Поиск по книгам и авторам:</label>
        <input type="search" id="search-input" class="search-box" placeholder="Например: Чехов или Степь" autocomplete="off">
      </div>

      <div class="filter-section">
        <label for="author-filter" class="field-label">Выбор автора:</label>
        <div class="select-wrapper">
          <select id="author-filter" class="author-dropdown">
            <option value="all">Все авторы (показать всё)</option>
          </select>
        </div>
        <button type="button" class="btn btn-reset-filter" id="btn-reset-filter" hidden>Сбросить фильтр</button>
      </div>

      <div class="catalog-summary" id="catalog-counter" aria-live="polite"></div>
      <div class="book-card-list" id="catalog-list"></div>
      <div id="catalog-error" class="error-banner" hidden></div>
    </section>

    <section id="view-details" class="view-panel" hidden>
      <nav class="view-navigation">
        <button type="button" class="btn btn-back" id="btn-back-to-catalog">← Назад к каталогу</button>
      </nav>

      <article class="book-detail-card">
        <h1 class="book-detail-title" id="detail-title"></h1>
        <p class="book-detail-author" id="detail-author"></p>
        <div class="book-detail-meta" id="detail-meta"></div>
        <div class="book-detail-progress" id="detail-progress" hidden>
          <p class="progress-text" id="detail-progress-text"></p>
        </div>
        <div class="book-detail-description">
          <h2 class="description-heading">О произведении</h2>
          <p id="detail-description"></p>
        </div>
        <button type="button" class="btn btn-action-large" id="btn-start-reading">Читать произведение</button>
      </article>
    </section>

    <section id="view-reader" class="view-panel" hidden>
      <nav class="view-navigation view-navigation-reader">
        <button type="button" class="btn btn-back" id="btn-back-to-details">← К описанию</button>
        <button type="button" class="btn btn-secondary" id="btn-quick-catalog">К списку книг</button>
      </nav>

      <header class="reader-heading-block">
        <h1 class="reader-work-title" id="reader-work-title"></h1>
        <p class="reader-work-author" id="reader-work-author"></p>
      </header>

      <div id="reader-status" class="status-banner" hidden></div>
      <article class="reader-text-area" id="reader-text-area" tabindex="0"></article>

      <div class="reader-footer-nav">
        <button type="button" class="btn btn-action-large" id="btn-reader-footer-back">← Завершить чтение</button>
      </div>
    </section>
  </main>

  <button type="button" class="btn-scroll-top" id="btn-scroll-top" aria-label="Наверх" hidden>↑ Наверх</button>

  <script src="script.js"></script>
</body>
</html>
